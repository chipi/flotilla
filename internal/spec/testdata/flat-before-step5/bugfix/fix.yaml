fleet: bugfix
routine: fix
description: >-
  The acting routine for code_bug cases (RFC-0010 §2, §9). A verdict on the issue, then fixes on the
  repo's main with gates on what the fix touches only (its tests fail on the base and pass with the
  fix; no new failure in the related tests; nothing in CI, hooks, config or the lockfile), up to three
  kick-backs with the advisor, a review, and a github.open_pr plan with the diff, or an escalation with
  the reason. The whole suite is the PR's CI. It holds no GitHub credential, and its worker can run on
  another machine (RFC-0011).
enabled: true
worker: bugfix-fix
trigger:
  # RFC-0013 §2: all of a case's runs together get $1 and 90 minutes; a case past either is escalated
  # instead of run again. Money counts only what the runs report as spend.
  case: {kind: code_bug, limit: {usd: 1, minutes: 90}}
models: [fix-flash, fix-reviewer]
# The rules every pi step gets instead of the repo's AGENTS.md (ADR-0018): a file in the fleet's folder, its
# hash handed to the run (FLOTILLA_PROMPTS), which refuses any other file. The same bytes as bugfix/fleet_rules.md.
prompts:
  rules: playbooks/rules.md
run:
  command: >-
    python3 /opt/flotilla/bugfix/fix.py --repo example/shop --worker-model fix-flash
    --advisor-model fix-reviewer --reviewer-model fix-reviewer --spend-file .bugfix-fix-spend
  workdir: .
  spend_file: .bugfix-fix-spend
  timeout: 3h
autonomy: shadow
max_autonomy: propose
budget:
  day_usd: 1
# What the routine page draws (internal/spec/explain.go). Keep each text true to bugfix/fix.py.
explain:
  trigger: >-
    Runs when flotillad hands over a code_bug case: bugfix/intake found an open bug issue in the repo
    and flotillad opened a case for it.
    All of a case's runs share $1 and 90 minutes; a case past either is escalated to you instead of
    run again (money counts only the spend the runs report).
  worker: >-
    Runs on the worker bugfix-fix, its own, which can be on another machine (RFC-0011): it holds only
    this routine's model key, so a steered coding agent cannot read another routine's. It has the repo's
    cache, node, the pi coding agent and the models' gateway; no GitHub credential.
  run: >-
    fix.py checks the repo out at main, asks for a verdict, then runs fix rounds with gates on what each
    fix touches: up to two kick-backs (one from the review), each resuming the fix's session; a review,
    then a plan or an escalation.
    Step one first, no model (RFC-0013 §1), advisory: it notes on the chain what main has of the names the
    error calls missing, and never closes a case.
  prompts: >-
    The rules the coding agent gets in every step instead of the repo's own AGENTS.md: keep what it
    reads and runs small, no generated files, no history dumps, no commits. The run refuses a rules file
    that is not the one flotillad hashed.
  models: >-
    The only aliases its runs can call: fix-flash for the coding agent, fix-reviewer for
    the advisor and the reviewer. Both use this routine's own gateway key (its own daily budget), so a
    run's spend is this routine's alone.
  autonomy: >-
    shadow records the plan inside flotilla; at propose the plan waits for your approval before a PR is
    opened. It can never act on its own.
  budget: >-
    The day's model spend; once it is reached, the routine's runs are skipped for the rest of the day.
    A run's spend is the gateway's bill for its keys, read before and after the run (bugfix/spend.py).
steps:
  - id: verdict
    lane: agent
    who: agent
    title: verdict
    short: is it a bug on main, and what is it
    explain: >-
      An agent reads the issue against main with read-only tools and answers actionable, needs-info or
      rejected, with its reason. Only actionable goes on to a fix; the others escalate.
  - id: coder
    lane: agent
    who: agent
    title: coding agent
    short: writes the fix and a failing test
    explain: >-
      pi on fix-flash writes the fix and a test that fails on the base and passes with the fix, in a
      worktree of the repo's main.
  - id: advisor
    lane: agent
    who: agent
    title: advisor
    short: sends a weak round back, up to 3 times
    explain: >-
      pi on fix-reviewer, read-only tools. When a round fails its gates (not when the review asked for
      changes) it only pins the file that owns the bug, unless the fix was already at an earlier pin; the
      verdict is then asked again with that evidence, and a verdict that is not actionable escalates. At
      most three kick-backs.
  - id: reviewer
    lane: agent
    who: agent
    title: reviewer
    short: approves, or asks for changes twice
    explain: >-
      The same model, read only, reviews the diff. Asking for changes sends the fix back, at most twice;
      if a later round fails, the last clean fix is kept and marked unresolved.
  - id: fixgates
    lane: gates
    who: code
    title: gates on the fix
    short: its tests fail on the base, pass with it
    explain: >-
      The fix's tests must load and fail on the base and pass with the fix; no new failure in the
      related tests; nothing in CI, hooks, config or the lockfile changes; no test file is deleted
      (a rename out of a test path counts as a deletion).
  - id: plan
    lane: outcome
    who: you
    title: github.open_pr plan
    short: the diff, the tests, the review
    explain: >-
      The fix as a plan on the case. At autonomy propose it waits for you on the case page: approve,
      reject or reassign it.
  - id: escalation
    lane: outcome
    who: you
    title: escalation
    short: no clean fix, with the reason
    explain: >-
      The verdict was not actionable, or no round passed its gates: the case is escalated to you with
      the reason.
