fleet: campaigns
routine: check
description: >-
  Checks that the campaign is launched or held as planned after the action ran, reading the stand-in
  campaign tool; flotillad escalates the case if it is not there within the check's window.
enabled: true
worker: ops-read
trigger:
  check: {verify: campaign_status}
run:
  command: env BIZ_DATA=/tmp/flotilla-example/campaigns BIZ_SEED=/opt/flotilla/fleets/campaigns/seed python3 /opt/flotilla/business/apply.py check
  workdir: .
  timeout: 2m
autonomy: shadow
budget:
  day_usd: 0
