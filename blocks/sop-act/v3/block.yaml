block: sop-act
version: 3
role: act
description: >-
  The SOP-aware acting step: follows the SOP that applies to its case, re-checks the registry's preconditions with fresh
  numbers (a backup's age, the free ratio of the case's mountpoint, or whether a service on the case's instance still reads
  down; no reading is unknown, never resolved) and plans the SOP's action, or hands the case to the investigate stage when
  no SOP applies. It plans only: policy decides.
consumes: {case: true}
emits: [plan, hand_over]
hands_to: [investigate]
actions: {}
# every param is optional: a flow sets the ones its action's preconditions read (the backup's metric, the disk's two, or the service gauge's metric and label)
params:
  metric: {kind: metric_name, env: BACKUP_METRIC, optional: true}
  avail_metric: {kind: metric_name, env: DISK_AVAIL_METRIC, optional: true}
  size_metric: {kind: metric_name, env: DISK_SIZE_METRIC, optional: true}
  service_metric: {kind: metric_name, env: SERVICE_METRIC, optional: true}
  service_label: {kind: string, env: SERVICE_LABEL, optional: true}
env: [VM_URL, BACKUP_INSTANCE, FLOTILLA_CASE]
model: none
# a flow lowers the cap; the registry's action and the host's caps still apply
# a routine that plans always carries this cap in its routine.yaml (the step may lower it)
max_autonomy: auto
timeout: 1m
command: python3 /opt/flotilla/ops/sop_act.py --fleet {{fleet}}
code: [ops/sop_act.py, ops/rerun_backup.py, ops/free_ratio.py, ops/service_up.py, ops/common.py, runtime/sops.py]
