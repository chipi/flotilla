block: sop-investigate
version: 4
role: stage
description: >-
  The investigate stage of cases no SOP covers. One station reads metrics through the one model client, by instance and
  by mountpoint, and reads every series of a metric with its labels (a service gauge, a mode, the processes holding a GPU),
  and decides a fix among the registry's actions for the case's kind; code refuses any other name and fills the plan's
  params from the case. The registry's preconditions are re-checked with fresh reads, a holder of the host and a health
  route's capability included.
consumes: {case: true, stage: investigate}
emits: [plan, hand_over]
hands_to: []
actions: {}
# a flow reads no backup's metric or instance here: the case says which instance and mountpoint, and the station reads them
params:
  vm_url: {kind: url, env: VM_URL}
  metric: {kind: metric_name, env: BACKUP_METRIC, optional: true}
  instance: {kind: string, env: BACKUP_INSTANCE, optional: true}
  registry: {kind: path, env: FLOTILLA_REGISTRY, optional: true}
  # the service gauge's metric and label, which a service action's precondition is re-checked with
  service_metric: {kind: metric_name, env: SERVICE_METRIC, optional: true}
  service_label: {kind: string, env: SERVICE_LABEL, optional: true}
  # the holder of the host and the health route, as in sop-act@4: the re-check of a chosen action reads the same facts
  holder_mode_metric: {kind: metric_name, env: HOLDER_MODE_METRIC, optional: true}
  holder_mode_label: {kind: string, env: HOLDER_MODE_LABEL, optional: true}
  holder_process_metric: {kind: metric_name, env: HOLDER_PROCESS_METRIC, optional: true}
  holder_container_metric: {kind: metric_name, env: HOLDER_CONTAINER_METRIC, optional: true}
  holder_prod_mode: {kind: string, env: HOLDER_PROD_MODE, optional: true}
  holder_trainer_mode: {kind: string, env: HOLDER_TRAINER_MODE, optional: true}
  health_source: {kind: source_name, env: HEALTH_SOURCE, optional: true}
env: [FLOTILLA_CASE, FLOTILLA_STATIONS]
# the block ships the station: harness, prompts, tools and limits (ADR-0020 section 6); a flow names the model alias
model: station
# a routine that plans always carries this cap in its routine.yaml (the step may lower it)
max_autonomy: propose
autonomy: propose
budget_usd: 1
timeout: 5m
command: python3 /opt/flotilla/ops/sop_investigate.py --fleet {{fleet}}
code: [ops/sop_investigate.py, ops/sop_act.py, ops/free_ratio.py, ops/service_up.py, ops/dgx_holder.py, ops/health.py, ops/common.py, runtime/sops.py, runtime/loaded.py]
texts: [system.md, task.md]
spec_tail: spec.tail.yaml
