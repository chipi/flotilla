site_name: flotilla
site_description: "A plain, spec-driven fleet platform for small fleets of AI agents: a control plane, a ledger of every decision, and fleets that propose, never act alone."
site_url: https://chipi.github.io/flotilla/
site_author: Marko Dragoljevic

repo_name: chipi/flotilla
repo_url: https://github.com/chipi/flotilla
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Architecture:
    - architecture/index.md
    - Context: architecture/context.md
    - Components: architecture/components.md
    - A run, end to end: architecture/run-lifecycle.md
    - Data: architecture/data.md
    - Deployment: architecture/deployment.md
  - Security: security.md
  - Testing and validation: testing.md
  - Decisions (ADR):
    - Overview: adr/README.md
    - ADR-0001 — Platform foundations: adr/ADR-0001-platform-foundations.md
    - ADR-0002 — Run in Docker: adr/ADR-0002-run-in-docker.md
    - ADR-0003 — Dependencies and images: adr/ADR-0003-dependencies-and-images.md
    - ADR-0004 — The job runtime: adr/ADR-0004-job-runtime.md
  - Proposals (RFC):
    - Overview: rfc/README.md
    - RFC-0001 — One fleet platform: rfc/RFC-0001-fleet-platform.md
    - RFC-0002 — The job runtime: rfc/RFC-0002-job-runtime.md
  - In progress:
    - Overview: wip/README.md
    - Phase 2 plan: wip/phase-2-plan.md
  - History:
    - Overview: history/README.md
    - 0001 — Genesis: history/0001-genesis.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chipi/flotilla
