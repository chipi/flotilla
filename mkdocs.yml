site_name: flotilla
site_description: "A plain, spec-driven platform for small fleets of AI agents that can act, within limits the operator sets and can see."
site_url: https://chipi.github.io/flotilla/
site_author: Marko Dragoljevic

repo_name: chipi/flotilla
repo_url: https://github.com/chipi/flotilla
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Architecture:
    - architecture/index.md
    - Context: architecture/context.md
    - Components: architecture/components.md
    - A case, end to end: architecture/run-lifecycle.md
    - Data: architecture/data.md
    - Deployment: architecture/deployment.md
  - Security: security.md
  - Testing and validation: testing.md
  - Decisions (ADR):
    - Overview: adr/README.md
    - ADR-0001 — Platform foundations: adr/ADR-0001-platform-foundations.md
    - ADR-0002 — Run in Docker: adr/ADR-0002-run-in-docker.md
    - ADR-0003 — Dependencies and images: adr/ADR-0003-dependencies-and-images.md
    - ADR-0004 — The job runtime: adr/ADR-0004-job-runtime.md
    - ADR-0005 — The agent pipeline: adr/ADR-0005-agent-pipeline.md
    - ADR-0006 — The node agent: adr/ADR-0006-node-agent.md
    - ADR-0007 — Routine replaces job: adr/ADR-0007-routine.md
    - ADR-0008 — One autonomy scale: adr/ADR-0008-autonomy.md
    - ADR-0009 — Host agent names: adr/ADR-0009-host-agent-names.md
    - ADR-0010 — Memory and knowledge: adr/ADR-0010-memory-and-knowledge.md
    - ADR-0011 — Tools and actions: adr/ADR-0011-tools-and-actions.md
    - ADR-0012 — Skills in the harness: adr/ADR-0012-skills.md
  - Proposals (RFC):
    - Overview: rfc/README.md
    - RFC-0001 — One fleet platform: rfc/RFC-0001-fleet-platform.md
    - RFC-0002 — The job runtime: rfc/RFC-0002-job-runtime.md
    - RFC-0004 — The agent pipeline: rfc/RFC-0004-agent-pipeline.md
    - RFC-0005 — Skills in the harness: rfc/RFC-0005-skills.md
  - In progress:
    - Overview: wip/README.md
    - Phase 2 plan: wip/phase-2-plan.md
    - Phase 3 plan: wip/phase-3-plan.md
  - History:
    - Overview: history/README.md
    - 0001 — Genesis: history/0001-genesis.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chipi/flotilla
