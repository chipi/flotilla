fleet: bugfix
routine: fix-podcast
description: >-
  The per-repo profile of bugfix/fix for chipi/podcast_scraper (pytest): the same chain as fix, with
  a venv installed in the worker's scratch, pytest-json-report's reports, the related tests of the
  mirrored test directories, and (built in under --test-format pytest) an allowlist of what a fix may
  change: a .py under the source root, a test_*.py or *_test.py under the test root, nothing else.
enabled: true
# ROADMAP B8, enabled in shadow on 2026-11-16 (operator's go). It relies on: its own case kind
# (flotillad allows one acting routine per kind, and code_bug is fix's), intake-podcast detecting it,
# chipi/podcast_scraper in github.open_pr's repo enum (host/registry.json), and pypi.org and
# files.pythonhosted.org in the bugfix proxy's allowlist.
worker: bugfix
trigger:
  # RFC-0013 §2 (operator, 2026-11-16): all of a case's runs together get $1 and 90 minutes; a case past
  # either is escalated instead of run again. Money counts only what the runs report as spend.
  case: {kind: code_bug_python, limit: {usd: 1, minutes: 90}}
models: [bugfix-flash, bugfix-reviewer]
run:
  # BUGFIX_VENV (outside the worktree, deleted with the run) and PIP_CACHE_DIR (the run's own,
  # deleted with it) are set by fix.py; HOME is the run's directory. --test-cmd and --setup run under sh in
  # the worktree, after fix.py has put its environment in; the report path replaces %s and the test
  # files (or the related directories) are appended. --continue-on-collection-errors: a test file
  # that cannot load on the base must not stop the others from running.
  command: >-
    python3 /opt/flotilla/bugfix/fix.py --repo chipi/podcast_scraper --worker-model bugfix-flash
    --advisor-model bugfix-reviewer --reviewer-model bugfix-reviewer
    --setup 'python3 -m venv "$BUGFIX_VENV" && "$BUGFIX_VENV/bin/pip" install -q -e ".[dev]"'
    --setup-timeout 1800
    --test-cmd 'PYTHONPATH="$PWD" "$BUGFIX_VENV/bin/python" -m pytest -p no:cacheprovider -n 0 --no-cov --disable-socket --allow-hosts=127.0.0.1,localhost --continue-on-collection-errors --json-report --json-report-file=%s'
    --test-format pytest
    --related pytest-dirs --source-root src/podcast_scraper --test-root tests/unit/podcast_scraper
    --exclude-path tests/fixtures/audio
    --upstream fleet-bugfix-flash=deepseek/deepseek-v4-flash --upstream fleet-bugfix-reviewer=z-ai/glm-5.2 --spend-file .bugfix-fix-podcast-spend
  workdir: .
  spend_file: .bugfix-fix-podcast-spend
  timeout: 3h
autonomy: shadow
max_autonomy: propose
budget:
  day_usd: 5
# What the routine page draws (internal/spec/explain.go). Keep each text true to bugfix/fix.py.
explain:
  trigger: >-
    Runs when flotillad hands over a code_bug_python case: bugfix/intake-podcast found an open bug issue
    in podcast_scraper and flotillad opened a case for it.
    All of a case's runs share $1 and 90 minutes; a case past either is escalated to you instead of
    run again (money counts only the spend the runs report).
  worker: >-
    Runs on the worker bugfix, on the X3 (RFC-0011): python3 with a venv per run in its scratch, the pi
    coding agent and the models' gateway; no GitHub credential.
  run: >-
    fix.py checks podcast_scraper out at main, installs it with its dev extras in a venv, asks for a
    verdict, then runs fix rounds with gates on what each fix touches, read from pytest's reports. Up to
    three kick-backs with the advisor, a review, then a plan or an escalation.
  models: >-
    The only aliases its runs can call: bugfix-flash for the coding agent, bugfix-reviewer for the
    advisor and the reviewer.
  autonomy: >-
    shadow records the plan inside flotilla; at propose the plan waits for your approval before a PR is
    opened. It can never act on its own.
  budget: >-
    The day's model spend; once it is reached, the routine's runs are skipped for the rest of the day.
    A run's spend is the gateway's bill for its keys, read before and after the run (bugfix/spend.py).
steps:
  - id: verdict
    lane: agent
    who: agent
    title: verdict
    short: is it a bug on main, and what is it
    explain: >-
      An agent reads the issue against main with read-only tools and answers actionable, needs-info or
      rejected, with its reason. Only actionable goes on to a fix; the others escalate.
  - id: coder
    lane: agent
    who: agent
    title: coding agent
    short: writes the fix and a failing test
    explain: >-
      pi on bugfix-flash writes the fix and a test that fails on the base and passes with the fix, in a
      worktree of podcast_scraper's main. The gates accept tests only under tests/unit/podcast_scraper,
      named test_*.py or *_test.py.
  - id: advisor
    lane: agent
    who: agent
    title: advisor
    short: sends a weak round back, up to 3 times
    explain: >-
      pi on bugfix-reviewer, read-only tools. When a round fails its gates (not when the review asked for
      changes) it only pins the file that owns the bug, unless the fix was already at an earlier pin; the
      verdict is then asked again with that evidence, and a verdict that is not actionable escalates. At
      most three kick-backs.
  - id: reviewer
    lane: agent
    who: agent
    title: reviewer
    short: approves, or asks for changes twice
    explain: >-
      The same model, read only, reviews the diff. Asking for changes sends the fix back, at most twice;
      if a later round fails, the last clean fix is kept and marked unresolved.
  - id: fixgates
    lane: gates
    who: code
    title: gates on the fix
    short: its tests fail on the base, pass with it
    explain: >-
      The fix's tests must load and fail on the base and pass with the fix (a skipped or erroring test
      counts as not run); no new failure in the mirrored test directories of the changed modules. Only a
      .py under src/podcast_scraper or a test_*.py / *_test.py under tests/unit/podcast_scraper may
      change: any other file (conftest.py, config, requirements, lock, data, docs, helpers, __init__.py
      under the tests, a .py elsewhere) is rejected, at any depth, naming the file. No test file may be
      deleted (a rename out of a test path counts as a deletion).
  - id: plan
    lane: outcome
    who: you
    title: github.open_pr plan
    short: the diff, the tests, the review
    explain: >-
      The fix as a plan on the case. At autonomy propose it waits for you on the case page: approve,
      reject or reassign it.
  - id: escalation
    lane: outcome
    who: you
    title: escalation
    short: no clean fix, with the reason
    explain: >-
      The verdict was not actionable, or no round passed its gates: the case is escalated to you with
      the reason.
