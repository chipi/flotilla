fleet: bugfix
routine: fix
description: >-
  The acting routine for code_bug cases (RFC-0010 §2, §9): fleetd's chain on the platform. A verdict
  on the issue, then fixes on orrery's main with gates on what the fix touches only (its tests fail on
  the base and pass with the fix; no new failure in the related tests; nothing in CI, hooks, config or
  the lockfile), up to three kick-backs with the advisor, a review, and a github.open_pr plan with the
  diff, or an escalation with the reason. The whole suite is the PR's CI. Its models are LiteLLM's
  fleet-bugfix aliases; it holds no GitHub credential. Runs on the X3 (RFC-0011).
enabled: true
worker: bugfix
trigger:
  case: {kind: code_bug}
models: [bugfix-flash, bugfix-reviewer]
run:
  command: >-
    python3 /opt/flotilla/bugfix/fix.py --repo chipi/orrery --worker-model bugfix-flash
    --advisor-model bugfix-reviewer --reviewer-model bugfix-reviewer
    --exclude-path static/images --exclude-path static/audio --exclude-path masters
    --upstream fleet-bugfix-flash=deepseek/deepseek-v4-flash --upstream fleet-bugfix-reviewer=z-ai/glm-5.2
  workdir: .
  timeout: 3h
autonomy: shadow
max_autonomy: propose
budget:
  day_usd: 5
