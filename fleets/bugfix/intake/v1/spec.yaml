run:
  command: python3 /opt/flotilla/bugfix/intake.py --repo example/shop --label bug --label triage-fleet/routed:bugfix
  workdir: .
  timeout: 2m
# What the routine page draws (internal/spec/explain.go). Keep each text true to bugfix/intake.py.
explain:
  trigger: >-
    Every hour. Each run reports every open bug issue again: an issue it no longer reports is taken as
    cleared.
  freshness: >-
    With no run ending ok for 3 hours the routine is stale: new bug issues would wait.
  worker: >-
    Runs on the worker bugfix. Read only: GitHub's public issues API, no credential needed.
  run: >-
    intake.py lists the repo's open issues labelled bug or routed to bugfix by triage and reports each as
    a detection, with the issue in its data.
  detects: >-
    Each issue is a code_bug detection. flotillad opens one case per issue; a detection of a known issue
    attaches to its case instead.
  autonomy: >-
    It only reads and reports; flotillad opens the cases.
  budget: >-
    No model: no spend.
