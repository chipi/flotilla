fleet: bugfix
routine: intake
description: >-
  The bugfix fleet's monitor (RFC-0010 §1): the repo's open issues labelled bug, or routed to bugfix by
  triage, each a code_bug detection with the issue in its data; flotillad opens a case per issue and
  absorbs a known one. Code only, read only: GitHub's public issues API.
enabled: true
worker: bugfix
trigger:
  every: 1h
detects: [code_bug]
autonomy: record
budget:
  day_usd: 0
freshness: 3h
