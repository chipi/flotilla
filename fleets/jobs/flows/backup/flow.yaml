# The example backup chain as a flow (RFC-0016). `flotilla flow expand fleets/jobs` writes the routine folders beside this
# one (backup-monitor, rerun-backup, verify-backup) from the blocks pinned here, and flotillad -check refuses when they differ.
flow: backup
case_kind: failed_backup
steps:
  - name: backup-monitor
    use: metric-monitor@1
    description: |-
      Reads when the backup last succeeded (BACKUP_METRIC, a metric of epoch seconds, for the instance
      BACKUP_INSTANCE) and reports a failed_backup detection when its age is above the threshold that
      backup.rerun's backup_age_above declares for the run's stage. flotillad opens the case. Code only:
      no model, nothing outward.
    worker: ops-read
    every: 10m
    freshness: 25m
    with: {action: backup.rerun, metric: backup_last_success_timestamp}
  - name: rerun-backup
    use: rerun-backup@1
    description: |-
      The acting routine for failed_backup cases: re-checks the backup's age with fresh numbers and plans
      backup.rerun on the case's host, or closes the case as resolved when a backup landed meanwhile. It
      plans only: policy decides, the host agent runs the command its own config allows for that action.
      It starts in shadow; a person raises it to propose, then to auto, on the record of its plans.
    worker: ops-act-host
    max_autonomy: auto
    with: {action: backup.rerun, metric: backup_last_success_timestamp}
  - name: verify-backup
    use: metric-verify@1
    description: |-
      The check for backup.rerun (the registry's check backup_newer_than_execution): while a case is in
      checking, it reads when the backup last succeeded and reports verified once that is after the rerun,
      not yet before. flotillad looks again after its backoff and escalates the case as not verified when
      the check's window (60m) ends first. Read only: no model, nothing outward.
    worker: ops-read
    verify: backup_newer_than_execution
    with: {action: backup.rerun, metric: backup_last_success_timestamp}
