block: rerun-backup
version: 1
role: act
description: >-
  Re-checks the backup's age with fresh numbers and plans the action that reruns it on the case's host, or closes the case
  as resolved when a backup landed meanwhile.
consumes: {case: true}
emits: [plan]
hands_to: []
actions: {}
params:
  action: {kind: registry_action, env: BACKUP_ACTION}
  metric: {kind: metric_name, env: BACKUP_METRIC}
env: [VM_URL, BACKUP_INSTANCE, FLOTILLA_CASE]
model: none
max_autonomy: auto
timeout: 1m
command: python3 /opt/flotilla/ops/rerun_backup.py
code: [ops/rerun_backup.py, ops/common.py]
