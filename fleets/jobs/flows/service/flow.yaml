# The example service watch as a flow (the DGX case, on RFC-0016 §8's model): one case per instance whose watched service has read
# down for two readings in a row (15 to 20 minutes at a 10m step), at record. `flotilla flow expand fleets/jobs` writes the routine
# folders beside this one (service-monitor, service-act, service-investigate, service-verify) from the blocks pinned here, and
# flotillad -check refuses when they differ. The service and the check window are the registry action's (dgx.gpu_mode_prod: its
# service_down precondition and its check), never repeated here except in `services`, which must list it.
#
# Holder-aware (the operator's decision of 2026-11-28): the server is down because a job HOLDS the host (a mode with its trainer or a
# session running) or because a mode was LEFT BEHIND. The acting step reads who holds the host from three gauges and picks between the
# registry's two actions for the kind: dgx.wait_for_holder while a job holds it (no switch: the case is watched until the holder ends),
# dgx.gpu_mode_prod only for a mode left behind. An unreadable holder never permits the switch. Both are record-only: nothing runs, the
# operator is told (a later step makes the switch a host action held at propose). service-act and service-investigate are pinned to
# sop-act@4 and sop-investigate@4. They stay version 1: this example is not deployed anywhere (an installation mounts its own over it),
# and a second version would need a shadow worker for each of their workers in every stack that runs the examples.
#
# The metric names, the services and the mode names are placeholders: an installation's own live in its private fleets repo. A service
# gauge that is a TCP-open check says the port is open, not that the model serves.
flow: service
case_kind: dgx_not_serving
steps:
  - name: service-monitor
    use: service-monitor@1
    worker: ops-read
    every: 10m
    freshness: 25m
    # an absent series is unknown, so a case stays open until two readings in a row read up; the mode gauge names what the host is doing
    with: {action: dgx.gpu_mode_prod, metric: service_up, service_label: service, services: model-prod, group_by: [instance],
           context: gpu_mode, context_label: mode, readings: 2, clear_after: 2, step: 10m}
  - name: service-act
    use: sop-act@4
    worker: ops-act-host
    max_autonomy: record
    case: {on_record: watch}
    with: {service_metric: service_up, service_label: service, fixes: first_holding, holder_mode_metric: gpu_mode, holder_mode_label: mode,
           holder_process_metric: gpu_process_count, holder_prod_mode: prod, holder_trainer_mode: robotics}
  - name: service-investigate
    use: sop-investigate@4
    worker: triage
    autonomy: record
    max_autonomy: propose
    case: {on_record: watch}
    model: triage-flash
    with: {vm_url: "http://victoria.example:8428", service_metric: service_up, service_label: service, holder_mode_metric: gpu_mode,
           holder_mode_label: mode, holder_process_metric: gpu_process_count, holder_prod_mode: prod, holder_trainer_mode: robotics}
  - name: service-verify
    use: service-verify@1
    worker: ops-read
    verify: service_up_again
    with: {action: dgx.gpu_mode_prod, metric: service_up, service_label: service}
