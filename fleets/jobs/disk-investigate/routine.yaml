fleet: jobs
routine: disk-investigate
description: >-
  The investigate stage of cases no SOP covers. One station reads metrics through the one model client, by instance and by mountpoint, and decides a fix among the registry's actions for the case's kind; code refuses any other name and fills the plan's params from the case.
enabled: true
worker: triage
trigger:
  case: {kind: disk_low, stage: investigate, on_record: watch}
autonomy: record
max_autonomy: propose
budget:
  day_usd: 1
