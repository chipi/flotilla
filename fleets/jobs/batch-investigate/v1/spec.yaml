run:
  command: env VM_URL=http://victoria.example:8428 HEALTH_SOURCE=health_example python3 /opt/flotilla/ops/sop_investigate.py --fleet jobs
  workdir: .
  timeout: 5m
stations:
  investigate:
    harness: flotilla
    model: triage-flash
    prompts: {system: system.md, task: task.md}
    tools: all
    tool_names: [metric, series]
    gates: []
    limits: {max_turns: 7, timeout: 2m}
limits: {operator: 1}
