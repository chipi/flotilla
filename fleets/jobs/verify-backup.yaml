fleet: jobs
routine: verify-backup
description: >-
  The check for backup.rerun (the registry's check backup_newer_than_execution): while a case is in
  checking, it reads when the backup last succeeded and reports verified once that is after the rerun,
  not yet before. flotillad looks again after its backoff and escalates the case as not verified when
  the check's window (60m) ends first. Read only: no model, nothing outward.
enabled: true
worker: ops-read
trigger:
  check: {verify: backup_newer_than_execution}
run:
  command: env BACKUP_ACTION=backup.rerun BACKUP_METRIC=backup_last_success_timestamp python3 /opt/flotilla/ops/verify_backup.py
  workdir: .
  timeout: 1m
autonomy: shadow
budget:
  day_usd: 0
