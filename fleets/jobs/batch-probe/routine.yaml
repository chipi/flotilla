fleet: jobs
routine: batch-probe
description: >-
  Reads a system's health route (the contract flotilla.health/1) and reports one detection per capability or component it watches: while it has read not up for N readings in a row (held until clear_after readings read up), or, as the readiness gate, once it has read up for clear_after readings after an outage. The capability or components are the ones the registry action's precondition names. Unknown is neither up nor down: a refused body, a component the body does not name or one that says unknown never opens a case and never clears one. A route that cannot be read fails the run. State is the probe's own snapshot in its ledger. Code only: no model, nothing outward.
enabled: true
worker: ops-read
trigger:
  every: 10m
detects: [batch_window_failed]
autonomy: record
budget:
  day_usd: 0
freshness: 25m
