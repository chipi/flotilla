fleet: jobs
routine: disk-act
description: >-
  The SOP-aware acting step: follows the SOP that applies to its case, re-checks the registry's preconditions with fresh numbers (a backup's age, or the free ratio of the case's mountpoint) and plans the SOP's action, or hands the case to the investigate stage when no SOP applies. It plans only: policy decides.
enabled: true
worker: ops-act-host
trigger:
  case: {kind: disk_low, on_record: watch}
autonomy: record
max_autonomy: record
budget:
  day_usd: 0
