fleet: ops
routine: case-review
description: >-
  The post-incident review (ADR-0016): reads the cases closed in the last 7 days and proposes what to
  learn, each proposal naming its evidence: a process_change (a threshold below its source's cycle, a
  check that keeps clearing itself, a fix that does not hold), or a note from a wrong diagnosis or a
  refused plan. It changes nothing; a person answers every proposal.
enabled: true
worker: ops-read
trigger:
  every: 30m
detects: [process_change]
run:
  command: python3 /opt/flotilla/ops/case_review.py
  workdir: .
  timeout: 2m
autonomy: shadow
budget:
  day_usd: 0
freshness: 75m
# External knowledge (RFC-0002 §7): the homelab handbook's page for a case kind. A proposal cites its
# path and version as one more line of evidence for the person who answers it. A kind with no page, or a
# worker whose volume is not filled, leaves the review as it was.
knowledge:
  sources: [homelab-handbook]
  queries: [by_case_kind]
