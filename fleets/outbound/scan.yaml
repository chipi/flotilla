fleet: outbound
routine: scan
description: >-
  Each prospect with no first touch yet is a prospect_new detection. Code only, read only.
enabled: true
worker: ops-read
trigger:
  every: 1h
detects: [prospect_new]
run:
  command: env BIZ_DATA=/tmp/flotilla-example/outbound BIZ_SEED=/opt/flotilla/fleets/outbound/data python3 /opt/flotilla/business/outbound.py scan
  workdir: .
  timeout: 2m
autonomy: shadow
budget:
  day_usd: 0
freshness: 3h
