fleet: triage
routine: cycle-shadow
description: >-
  The live triage cycle's command run by a candidate version, beside the live routine, for shadow
  comparison (ADR-0004, RFC-0002 §8 and §9): the worker `triage-candidate` runs the image tag under
  test with its own state volume. Capped at shadow: it never acts, whatever an autonomy control says.
  An installation without a candidate worker lists it in disabled_routines.
enabled: true
worker: triage-candidate
trigger:
  every: 10m
run:
  command: python3 orchestrator.py --cycle --limit 10 --no-dry-run
  workdir: signal-fleet/mvp
  timeout: 20m
  spend_file: signal-fleet/results/.last_cycle_spend
autonomy: shadow
max_autonomy: shadow
budget:
  day_usd: 2.0
freshness: 35m
# The class hints (ADR-0012): triage's code classes the signal, a rule loads its hint, rendered after
# the SIGNAL JSON. fleets/triage/skills/default-rules.json is the same list for runs without flotillad
# (a Go test keeps them equal).
skills:
  rule:
    - when: {class: external-transient}
      load: [hint-external-transient]
    - when: {class: external}
      load: [hint-external]
    - when: {class: environment}
      load: [hint-environment]
    - when: {class: recoverable}
      load: [hint-recoverable]
# The model-driven step (RFC-0002 §4). fleets/triage/harness-default.json is the same for runs
# without flotillad (a Go test keeps them equal). The quirks keep today's loop like for like; RFC-0002
# §9 step 6 removes them one at a time, each by model replay.
harness:
  protocol: json
  tools: [event_detail, occurrence_history, service_logs, metric, trace, source_state]
  gates: [intent, cleanup, dismiss_corroborated, edge]
  limits: {max_tool_calls: 3, max_steps: 4, tool_calls_per_turn: 1}
  quirks:
    bad_json_uses_turn: true
    empty_retry: true
    final_decision_call: true
    reply_echo_chars: 600
    decision_echo_chars: 400
    result_chars: 1800
