fleet: triage
routine: cycle-shadow
description: >-
  Triage beside the live routine, for shadow comparison (ADR-0004, RFC-0002 §8 and §9): the worker
  `triage-candidate` runs with its own state volume. Capped at shadow: it never acts, whatever an
  autonomy control says. An installation without a candidate worker lists it in disabled_routines.
  Today (fleet-eval-data ROADMAP M2b, 2026-11-16) it is the live code on Qwen3-30B-A3B on the DGX's
  prod vLLM (gateway alias fleet-triage-local), within that vLLM owner's terms: at most 10 model
  requests per 10-minute cycle, so GlitchTip only and 2 triages (a triage makes at most 5: four turns
  and the final decision call); none 00:00-05:30 UTC (Close Listening's nightly); one at a time and a
  120 s timeout (the gateway alias). --glitchtip runs dry unless given --no-dry-run, which it never is.
  To compare another image instead, run the live cycle's command here again.
enabled: true
worker: triage-candidate
trigger:
  every: 10m
run:
  command: >-
    if [ "$(date -u +%H%M)" -lt 0530 ]; then echo "not run: 00:00-05:30 UTC belongs to the DGX nightly";
    exit 0; fi; exec env SF_TRIAGE_MODEL=fleet-triage-local python3 orchestrator.py --glitchtip --limit 2
  workdir: signal-fleet/mvp
  timeout: 20m
autonomy: shadow
max_autonomy: shadow
budget:
  day_usd: 2.0
freshness: 35m
# The class hints (ADR-0012): triage's code classes the signal, a rule loads its hint, rendered after
# the SIGNAL JSON. fleets/triage/skills/default-rules.json is the same list for runs without flotillad
# (a Go test keeps them equal).
skills:
  rule:
    - when: {class: external-transient}
      load: [hint-external-transient]
    - when: {class: external}
      load: [hint-external]
    - when: {class: environment}
      load: [hint-environment]
    - when: {class: recoverable}
      load: [hint-recoverable]
# The model-driven step (RFC-0002 §4). fleets/triage/harness-default.json is the same for runs
# without flotillad (a Go test keeps them equal). The quirks keep today's loop like for like; RFC-0002
# §9 step 6 removes them one at a time, each by model replay.
harness:
  protocol: json
  tools: [event_detail, occurrence_history, service_logs, metric, trace, source_state]
  gates: [intent, cleanup, dismiss_corroborated, edge]
  limits: {max_tool_calls: 3, max_steps: 4, tool_calls_per_turn: 1}
  quirks:
    bad_json_uses_turn: true
    empty_retry: true
    final_decision_call: true
    reply_echo_chars: 600
    decision_echo_chars: 400
    result_chars: 1800
# The same external knowledge as the live routine (RFC-0002 §7), so the shadow comparison measures it.
knowledge:
  sources: [homelab-handbook]
  queries: [by_service]
