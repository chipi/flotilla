fleet: triage
routine: cycle
description: >-
  One triage pass over Grafana alerts and GlitchTip errors (signal-fleet/mvp/orchestrator.py),
  unchanged from fleetd's cycle. Phase 2 wraps today's command; phase 3 moves it onto the routine
  runtime.
enabled: true
worker: triage
trigger:
  every: 10m
run:
  command: python3 orchestrator.py --cycle --limit 10 --no-dry-run
  workdir: signal-fleet/mvp
  timeout: 20m
  spend_file: signal-fleet/results/.last_cycle_spend
# shadow takes no outward action (orchestrator.py forces a dry run). The installation raises it to
# propose with `flotilla autonomy triage/cycle propose` at the switch; the spec stays the safe default.
autonomy: shadow
budget:
  day_usd: 2.0
freshness: 35m
