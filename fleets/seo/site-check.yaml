fleet: seo
routine: site-check
description: >-
  RFC-0012 §2: for each site in the fleet folder's sites.json (fleets/seo/sites.json), robots.txt lets the named crawlers in, every sitemap
  answers and lists URLs, a fixed set of pages and one page per sampled prefix answer 200 on the site's
  own host, indexable, with a title, a description, a self canonical, and (where the site declares them)
  JSON-LD that parses and hreflang alternates that answer; retired hosts answer 404 or noindex. Each
  failed check is one seo_live_regression detection; flotillad opens the case. Code only, read only.
enabled: true
worker: marketing
trigger:
  every: 24h
detects: [seo_live_regression]
run:
  command: python3 /opt/flotilla/seo/site_check.py
  workdir: .
  timeout: 10m
autonomy: shadow
budget:
  day_usd: 0
freshness: 26h
