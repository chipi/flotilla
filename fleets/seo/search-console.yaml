fleet: seo
routine: search-console
description: >-
  RFC-0012 §2: each site in Google Search Console, as the fleet's service account. Clicks against the
  week before (a drop is a seo_traffic_drop), queries ranking 8 to 20 with at least 100 impressions in
  28 days (seo_opportunity, the 10 largest per site), and the site's fixed pages through URL Inspection
  (seo_not_indexed when Google has not indexed one). The week's numbers go to the brief's Search
  section. Code only, read only.
enabled: true
worker: marketing
trigger:
  every: 168h
detects: [seo_traffic_drop, seo_opportunity, seo_not_indexed]
brief_section: Search
run:
  command: python3 /opt/flotilla/seo/search_console.py
  workdir: .
  timeout: 10m
autonomy: shadow
budget:
  day_usd: 0
freshness: 170h
