fleet: plumbing
routine: send-create-tasks
description: >-
  Carries out an approved plumbing.create_tasks plan (plumbing/call.py): checks the plan's hash is the approved one
  and the payload's shape, then posts it once, signed, to the installation's plumbing.create_tasks callback, and
  reports what the plumbing says it made. It never retries: a call that timed out may have been delivered.
enabled: true
worker: plumbing
trigger:
  execute: {action: plumbing.create_tasks}
autonomy: propose
budget:
  day_usd: 0
