fleet: crm
routine: check-merge
description: >-
  Checks that the kept contact is there and the dropped one gone after the action ran, reading the
  stand-in CRM; flotillad escalates the case if it is not there within the check's window.
enabled: true
worker: ops-read
trigger:
  check: {verify: crm_merged}
run:
  command: env BIZ_DATA=/tmp/flotilla-example/crm BIZ_SEED=/opt/flotilla/fleets/crm/data python3 /opt/flotilla/business/apply.py check
  workdir: .
  timeout: 2m
autonomy: shadow
budget:
  day_usd: 0
