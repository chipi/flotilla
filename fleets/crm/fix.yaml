fleet: crm
routine: fix
description: >-
  The acting routine for crm_fix cases: re-checks the contact now and plans crm.update_field or
  crm.merge, refusing a locked field or a merge of different emails, or closes the case when the
  contact changed meanwhile. It starts in shadow; a person raises it.
enabled: true
worker: ops-read
trigger:
  case: {kind: crm_fix}
run:
  command: env BIZ_DATA=/tmp/flotilla-example/crm BIZ_SEED=/opt/flotilla/fleets/crm/data python3 /opt/flotilla/business/crm.py fix
  workdir: .
  timeout: 2m
autonomy: shadow
max_autonomy: auto
budget:
  day_usd: 0
