fleet: crm
routine: scan
description: >-
  Every contact in the CRM: a field to normalize (email case and spaces, a country name instead of its
  code) or a duplicate (the same email) is a crm_fix detection. Code only, read only.
enabled: true
worker: ops-read
trigger:
  every: 1h
detects: [crm_fix]
run:
  command: env BIZ_DATA=/tmp/flotilla-example/crm BIZ_SEED=/opt/flotilla/fleets/crm/data python3 /opt/flotilla/business/crm.py scan
  workdir: .
  timeout: 2m
autonomy: shadow
budget:
  day_usd: 0
freshness: 3h
