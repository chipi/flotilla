# Build the six images and push them to ghcr.io, tagged sha-<7> (ADR-0002). A deploy names that
# tag; nothing deploys :latest. Called by ci-fast.yml, after ci-fast succeeded for the same commit and
# when an image's files changed (the path list is in ci-fast.yml's `changes` job); it has no trigger of
# its own, so no commit gets an image without passing ci-fast. A manual rebuild is ci-fast.yml's
# workflow_dispatch.
name: images

on:
  workflow_call:

concurrency:
  group: images-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        run: printf '%s' "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # buildx --push (as other projects' docker.yml does); plain `docker push` had its
          # manifest refused ("denied") by ghcr on 2026-11-08 after the layers were uploaded.
          # No attestations: one plain image manifest per tag.
          docker buildx create --use --name flotilla >/dev/null
          for i in flotillad worker-triage worker-ops worker-bugfix worker-marketing smokescreen; do
            ref="ghcr.io/chipi/flotilla-$i:$TAG"
            docker buildx build --push --provenance=false --sbom=false \
              -f "deploy/docker/$i.Dockerfile" --build-arg VERSION="$TAG" \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              --label org.opencontainers.image.revision=${{ github.sha }} \
              --metadata-file "/tmp/$i.json" -t "$ref" .
            echo "pushed $ref $(python3 -c "import json;print(json.load(open('/tmp/$i.json'))['containerimage.digest'])")"
          done
