# Fast feedback CI — what every push must pass: `make ci-fast` (gofmt, go vet, go test for fleetd;
# byte-compile and the unit tests for the triage fleet). The replays need the private corpora and
# run on a host (`make replay`), not here. Per global AGENTS.md #3: red on this is "fix until
# green", not advice.

name: ci-fast

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runner image's own Go and Python 3: the fleet code is stdlib-only and fleetd has no
      # dependencies, so no setup actions. Go fetches the version fleetd's go.mod asks for itself
      # (GOTOOLCHAIN=auto).
      - name: Toolchain versions
        run: go version && python3 --version

      - name: Run ci-fast
        run: make ci-fast
