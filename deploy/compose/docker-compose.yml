# flotilla on one host (ADR-0002): flotillad, the triage worker and the egress proxy.
#
# Installation paths come from the environment (FLOTILLA_HOME/.env on the host, never in git) and the
# files in FLOTILLA_CONFIG (README.md). Nothing here writes to the host: the store, the triage
# fleet's state and the secrets live in Docker volumes inside the VM. Host folders are mounted
# read-only, for config only, like every other stack on the host; writing through the VM's sshfs
# mount would ride the lima SSH connection whose failures took production down before.
#
# Secrets reach the containers through their own volumes, filled by deploy/server/secrets.sh from the
# host's files (mode 600 there, owned by the container's uid in the volume). Nothing secret is in an
# environment variable or a bind mount.
#
# Networks:
#   flotilla       internal: no route out. flotillad, the worker and the proxy talk here.
#   ui             internal: flotillad's UI listener and the installation's caddy-tailscale proxy (ADR-0014).
#   out            the proxy's way to the internet (api.github.com).
#   the services'  the proxy joins the networks of the services routines read (VictoriaMetrics, LiteLLM,
#                  GlitchTip, Langfuse) and reaches them by container name, never through the
#                  host's port forwards.
# Nothing is published on the host. The CLI runs inside flotillad: docker exec flotillad flotilla status
#
# The candidate worker (profile `candidate`, off unless COMPOSE_PROFILES=candidate): a second triage
# worker running the image tag under test (FLOTILLA_CANDIDATE_TAG) with its own state volume, for the
# routine triage/cycle-shadow, which its spec caps at shadow (ADR-0004: shadow comparison).
#
# The shadow worker (profile shadow, off unless COMPOSE_PROFILES=shadow; docs/wip/v2-design.md section 4): where the shadow versions of
# the triage routines run, beside the live worker. It is not the candidate: the candidate is a second image of a whole fleet, this runs a
# version of one routine on the live image. It holds its own worker token (flotillad refuses to share one), the READ environment only
# (credentials that can read; never a write credential), the live worker's snapshots read-only, its own state volume and its own egress
# proxy, with less CPU and memory than the live worker, so a shadow cannot starve a live run and its proxy log never mixes with the live one.
name: flotilla

x-hardening: &hardening
  read_only: true
  init: true   # PID 1 reaps orphans: a routine's grandchildren must not pile up as zombies
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  flotillad:
    <<: *hardening
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-flotillad:${FLOTILLA_TAG:?set FLOTILLA_TAG}
    container_name: flotillad
    mem_limit: 256m
    cpus: 0.5
    environment:
      HTTP_PROXY: http://egress:4750
      HTTPS_PROXY: http://egress:4750
      NO_PROXY: worker-triage,worker-triage-candidate,worker-triage-shadow,worker-ops-read,worker-ops-act-host,worker-bugfix,worker-bugfix-act,worker-marketing,egress,localhost,127.0.0.1
      FLOTILLA_URL: http://127.0.0.1:8484
      FLOTILLA_TOKEN_FILE: /run/flotilla/cli.token
      FLOTILLA_CONFIG_HASH: ${FLOTILLA_CONFIG_HASH_FLOTILLAD:-}   # deploy.sh: a changed config recreates it
    volumes:
      - ${FLOTILLA_CONFIG:?set FLOTILLA_CONFIG}/flotillad.yaml:/etc/flotilla/flotillad.yaml:ro
      - ${FLOTILLA_CONFIG}/callers.yaml:/etc/flotilla/callers.yaml:ro
      - flotillad-secrets:/run/flotilla:ro
      - state:/var/lib/flotilla
    networks: [flotilla, ui, shadow, plumbing]   # plumbing: the installation's plumbing tool (RFC-0014 §4.7), flotillad alone
    depends_on:
      egress: {condition: service_started}
      worker-triage: {condition: service_healthy}   # the first run starts at boot: the worker must be listening
      # The ops workers too, when their profile runs (required: false leaves a host without it alone);
      # 2026-11-14 the monitor's first run at boot met a worker not yet listening.
      worker-triage-candidate: {condition: service_healthy, required: false}   # profile candidate: an old candidate must not race the start (run_tokens: required refuses it)
      worker-ops-read: {condition: service_healthy, required: false}
      worker-ops-act-host: {condition: service_healthy, required: false}
      worker-bugfix: {condition: service_healthy, required: false}
      worker-bugfix-act: {condition: service_healthy, required: false}
      worker-marketing: {condition: service_healthy, required: false}
    healthcheck:
      test: ["CMD", "/usr/local/bin/flotilla", "health"]
      interval: 60s
      timeout: 10s
      retries: 3

  worker-triage:
    <<: *hardening
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-worker-triage:${FLOTILLA_TAG}
    container_name: flotilla-worker-triage
    mem_limit: 1g
    cpus: 1.0
    tmpfs: ["/tmp:size=64m"]
    env_file: ["${FLOTILLA_CONFIG}/worker-triage.env"]   # ROUTINE_* overrides only; no secrets in it
    environment:
      FLOTILLA_WORKER_TOKEN_FILE: /run/flotilla/worker.token
      FLOTILLA_ENV_FILES: /run/flotilla/fleet.env
      FLOTILLA_WORKER_LISTEN: 0.0.0.0:8081
      ROUTINE_HTTP_PROXY: http://egress:4750
      ROUTINE_HTTPS_PROXY: http://egress:4750
      # the ledger on flotillad's workers' listener (RFC-0002 §9 step 5), not through the proxy
      ROUTINE_FLOTILLA_API_URL: http://flotillad:8485
      ROUTINE_NO_PROXY: flotillad
      ROUTINE_SF_LEDGER_BACKEND: ${TRIAGE_LEDGER_BACKEND:-tsv}   # api once its namespace is imported (RFC-0002 §9 step 5)
    volumes:
      - worker-triage-secrets:/run/flotilla:ro
      - triage-state:/home/worker/signal-fleet
      - triage-snapshots:/snapshots   # the live run's state, frozen when it starts: a shadow starts from it (the shadow worker reads it)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/livez', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    networks: [flotilla]

  worker-triage-candidate:
    <<: *hardening
    profiles: [candidate]
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-worker-triage:${FLOTILLA_CANDIDATE_TAG:-${FLOTILLA_TAG}}
    container_name: flotilla-worker-triage-candidate
    mem_limit: 1g
    cpus: 1.0
    tmpfs: ["/tmp:size=64m"]
    env_file: ["${FLOTILLA_CONFIG}/worker-triage.env"]
    environment:
      FLOTILLA_WORKER_TOKEN_FILE: /run/flotilla/worker.token
      FLOTILLA_ENV_FILES: /run/flotilla/fleet.env
      FLOTILLA_WORKER_LISTEN: 0.0.0.0:8081
      ROUTINE_HTTP_PROXY: http://egress:4750
      ROUTINE_HTTPS_PROXY: http://egress:4750
      # the ledger on flotillad's workers' listener (RFC-0002 §9 step 5), not through the proxy
      ROUTINE_FLOTILLA_API_URL: http://flotillad:8485
      ROUTINE_NO_PROXY: flotillad
      ROUTINE_SF_LEDGER_BACKEND: ${TRIAGE_CANDIDATE_LEDGER_BACKEND:-tsv}   # api once its namespace is imported
      # over worker-triage.env, which is the live fleet's: the candidate's series, inbox and traces carry
      # their own name (the Hub and dashboards count triage-fleet), and it mirrors nothing into GlitchTip
      ROUTINE_SF_SERVICE: triage-fleet-candidate
      ROUTINE_SF_GLITCHTIP_SYNC: "0"
    volumes:
      - worker-triage-candidate-secrets:/run/flotilla:ro # its own worker token, and the fleet's env; shadow never writes outward
      - triage-candidate-state:/home/worker/signal-fleet  # never the live state
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/livez', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    networks: [flotilla]

  worker-triage-shadow:
    <<: *hardening
    profiles: [shadow]
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-worker-triage:${FLOTILLA_TAG}
    container_name: flotilla-worker-triage-shadow
    mem_limit: 512m          # below the live worker's 1g
    cpus: 0.5                # below the live worker's 1.0
    cpu_shares: 128          # and, when the host is busy, last in line (the default is 1024)
    tmpfs: ["/tmp:size=64m", "/home/worker:size=64m,uid=10001,gid=10001,mode=0700"]
    env_file: ["${FLOTILLA_CONFIG}/worker-triage.env"]   # ROUTINE_* overrides only; no secrets in it
    environment:
      FLOTILLA_WORKER_MODE: shadow
      FLOTILLA_WORKER_TOKEN_FILE: /run/flotilla/worker.token
      FLOTILLA_READ_ENV_FILES: /run/flotilla/read.env   # the credentials that can read; there is no FLOTILLA_ENV_FILES and no write file
      # the names of credentials that write, which the worker refuses in a shadow run's environment whatever file or override they came
      # in by (it also has a built-in list of the names this repo's routines use; this adds to it)
      FLOTILLA_WRITE_KEYS: GH_TOKEN,GITHUB_TOKEN,GLITCHTIP_WRITE_TOKEN,GRAFANA_ADMIN_PASSWORD,GRAFANA_PASSWORD,SLACK_BOT_TOKEN,SLACK_TOKEN,SLACK_WEBHOOK_URL,PUSH_KEY,DEPLOY_KEY,GITHUB_APP_KEY_FILE
      FLOTILLA_WORKER_LISTEN: 0.0.0.0:8081
      ROUTINE_HTTP_PROXY: http://egress-shadow:4750
      ROUTINE_HTTPS_PROXY: http://egress-shadow:4750
      ROUTINE_FLOTILLA_API_URL: http://flotillad:8485
      ROUTINE_NO_PROXY: flotillad
      # the live worker's ledger backend: a shadow's decisions are paired only through flotillad's ledger (its own namespace there, the live
      # rows as of its input); with the TSV default they stay in its own volume and nothing pairs
      ROUTINE_SF_LEDGER_BACKEND: ${TRIAGE_LEDGER_BACKEND:-tsv}
      # over worker-triage.env, which is the live fleet's: the shadow's series, inbox and traces carry their own name, and it mirrors
      # nothing into GlitchTip
      ROUTINE_SF_SERVICE: triage-fleet-shadow
      ROUTINE_SF_GLITCHTIP_SYNC: "0"
    volumes:
      - worker-triage-shadow-secrets:/run/flotilla:ro   # its own worker token and the read environment; no live secrets volume
      - triage-snapshots:/snapshots:ro                  # a shadow starts from the live run's frozen state and never writes it
      - triage-shadow-state:/home/worker/signal-fleet   # never the live state
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/livez', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    networks: [shadow]   # not `flotilla`: it cannot reach the live proxy or any live worker; flotillad is on both

  # The shadow worker's own egress proxy (profile shadow): the same image and settings as egress, its own allowlist
  # (FLOTILLA_CONFIG/egress-shadow-acl.yaml), so what a shadow reaches is decided apart from the live worker and every proxy log line of a
  # shadow carries this container's name.
  egress-shadow:
    <<: *hardening
    profiles: [shadow]
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-smokescreen:${FLOTILLA_TAG}
    container_name: flotilla-egress-shadow
    mem_limit: 128m
    cpus: 0.5
    command: ["--config-file", "/etc/smokescreen/smokescreen.yaml", "--expose-prometheus-metrics"]
    environment:
      FLOTILLA_CONFIG_HASH: ${FLOTILLA_CONFIG_HASH_EGRESS_SHADOW:-}
    volumes:
      - ${FLOTILLA_CONFIG}/smokescreen.yaml:/etc/smokescreen/smokescreen.yaml:ro
      - ${FLOTILLA_CONFIG}/egress-shadow-acl.yaml:/etc/smokescreen/acl.yaml:ro
    networks: [shadow, out, backend, litellm, glitchtip]   # not langfuse: pushing a trace is a write, and a shadow writes nothing (no-effect)

  # The ops workers (pipeline v1, ADR-0005 decision 5: workers per role), profile ops: one image, two
  # roles. ops-read runs the monitors, ops-act-host the acting routines (it holds no host key: flotillad
  # signs executions, ADR-0006). Neither holds a fleet secret, only its worker token. A run writes its
  # plan file under HOME, a tmpfs (the root is read-only). worker-ops.env sets ROUTINE_VM_URL,
  # ROUTINE_BACKUP_INSTANCE and ROUTINE_BACKUP_TARGET (installation facts).
  worker-ops-read:
    <<: *hardening
    profiles: [ops]
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-worker-ops:${FLOTILLA_TAG}
    container_name: flotilla-worker-ops-read
    mem_limit: 256m
    cpus: 0.5
    tmpfs: ["/tmp:size=16m", "/home/worker:size=16m,uid=10001,gid=10001,mode=0700"]
    env_file: ["${FLOTILLA_CONFIG}/worker-ops.env"]
    environment: &ops-env
      FLOTILLA_WORKER: ops-read
      FLOTILLA_WORKER_TOKEN_FILE: /run/flotilla/worker.token
      FLOTILLA_WORKER_LISTEN: 0.0.0.0:8081
      ROUTINE_HTTP_PROXY: http://egress:4750
      ROUTINE_HTTPS_PROXY: http://egress:4750
      ROUTINE_NO_PROXY: flotillad
      # ops/case-review reads cases on flotillad's worker listener with this worker's token (ADR-0016)
      ROUTINE_FLOTILLA_API_URL: http://flotillad:8485
    volumes:
      - worker-ops-read-secrets:/run/flotilla:ro
    healthcheck: &ops-health
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/livez', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    networks: [flotilla]

  worker-ops-act-host:
    <<: *hardening
    profiles: [ops]
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-worker-ops:${FLOTILLA_TAG}
    container_name: flotilla-worker-ops-act-host
    mem_limit: 256m
    cpus: 0.5
    tmpfs: ["/tmp:size=16m", "/home/worker:size=16m,uid=10001,gid=10001,mode=0700"]
    env_file: ["${FLOTILLA_CONFIG}/worker-ops.env"]
    environment:
      <<: *ops-env
      FLOTILLA_WORKER: ops-act-host
    volumes:
      - worker-ops-act-host-secrets:/run/flotilla:ro
    healthcheck: *ops-health
    networks: [flotilla]

  # The bugfix fleet's worker (profile bugfix, RFC-0010 §4): it clones the repos it fixes, runs their
  # code (installs, tests) and the coding harness, so it holds only its worker token and its model key
  # (/run/flotilla/model.key, named by flotillad.yaml's bugfix endpoint as key_file). Nothing in it can
  # push: the GitHub App key is on worker-bugfix-act only, which runs the executing routine (it applies an
  # approved diff and pushes; it runs no repo code and holds no model key), as ops-read and ops-act-host
  # split reading from acting. Worktrees live on the scratch volume and are deleted at the end of each
  # run; the repo mirror and the npm cache stay there between runs. Node reads the proxy from the
  # environment only with NODE_USE_ENV_PROXY.
  worker-bugfix:
    <<: *hardening
    profiles: [bugfix]
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-worker-bugfix:${FLOTILLA_TAG}
    container_name: flotilla-worker-bugfix
    mem_limit: 4g
    cpus: 2.0
    tmpfs: ["/tmp:size=256m", "/home/worker:size=64m,uid=10001,gid=10001,mode=0700"]
    environment:
      FLOTILLA_WORKER: bugfix
      FLOTILLA_WORKER_TOKEN_FILE: /run/flotilla/worker.token
      FLOTILLA_WORKER_LISTEN: 0.0.0.0:8081
      ROUTINE_HTTP_PROXY: http://egress-bugfix:4750
      ROUTINE_HTTPS_PROXY: http://egress-bugfix:4750
      # the target repo's tests serve on loopback; Node sends everything else to the proxy
      ROUTINE_NO_PROXY: flotillad,localhost,127.0.0.1,::1
      ROUTINE_NODE_USE_ENV_PROXY: "1"
      ROUTINE_BUGFIX_SCRATCH: /scratch
      # no ROUTINE_FLOTILLA_API_*: no bugfix routine reads flotillad's worker API, and pi's tools, steered
      # by an untrusted issue, would inherit them (the advisor's review, 2026-11-15)
    volumes:
      - worker-bugfix-secrets:/run/flotilla:ro
      - bugfix-scratch:/scratch
    healthcheck: *ops-health
    networks: [flotilla]

  # The bugfix fleet's pusher (profile bugfix): bugfix/open-pr, after a person approved a PR plan. It
  # holds the GitHub App's key (/run/flotilla/github-app.pem) and nothing else: no model key, and it
  # runs no repo code (it fetches the base without a checkout and applies the diff to the index). The
  # App's ids are not secrets: BUGFIX_GITHUB_APP_ID and BUGFIX_GITHUB_APP_INSTALLATION_ID in
  # FLOTILLA_HOME/.env. Without them open-pr escalates, and the plan can be applied by hand.
  worker-bugfix-act:
    <<: *hardening
    profiles: [bugfix]
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-worker-bugfix:${FLOTILLA_TAG}
    container_name: flotilla-worker-bugfix-act
    mem_limit: 512m
    cpus: 0.5
    tmpfs: ["/tmp:size=256m", "/home/worker:size=16m,uid=10001,gid=10001,mode=0700"]
    environment:
      FLOTILLA_WORKER: bugfix-act
      FLOTILLA_WORKER_TOKEN_FILE: /run/flotilla/worker.token
      FLOTILLA_WORKER_LISTEN: 0.0.0.0:8081
      ROUTINE_HTTP_PROXY: http://egress-bugfix:4750
      ROUTINE_HTTPS_PROXY: http://egress-bugfix:4750
      ROUTINE_NO_PROXY: flotillad
      ROUTINE_GITHUB_APP_ID: ${BUGFIX_GITHUB_APP_ID:-}
      ROUTINE_GITHUB_APP_INSTALLATION_ID: ${BUGFIX_GITHUB_APP_INSTALLATION_ID:-}
      ROUTINE_GITHUB_APP_KEY_FILE: /run/flotilla/github-app.pem
    volumes:
      - worker-bugfix-act-secrets:/run/flotilla:ro
    healthcheck: *ops-health
    networks: [flotilla]

  # The seo fleet's worker (profile seo, RFC-0012): it reads the operator's websites, their Umami data
  # (as a view-only user, /run/flotilla/umami.env) and their Search Console data (a service account's
  # key, /run/flotilla/gsc.json). Read only.
  worker-marketing:
    <<: *hardening
    profiles: [seo]
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-worker-marketing:${FLOTILLA_TAG}
    container_name: flotilla-worker-marketing
    mem_limit: 256m
    cpus: 0.5
    tmpfs: ["/tmp:size=16m", "/home/worker:size=32m,uid=10001,gid=10001,mode=0700"]
    environment:
      FLOTILLA_WORKER: marketing
      FLOTILLA_WORKER_TOKEN_FILE: /run/flotilla/worker.token
      FLOTILLA_WORKER_LISTEN: 0.0.0.0:8081
      ROUTINE_HTTP_PROXY: http://egress-seo:4750
      ROUTINE_HTTPS_PROXY: http://egress-seo:4750
      ROUTINE_NO_PROXY: flotillad
      ROUTINE_SEO_UMAMI_URL: http://umami:3000   # Umami's container, through the proxy on its network
    volumes:
      - worker-marketing-secrets:/run/flotilla:ro
    healthcheck: *ops-health
    networks: [flotilla]

  egress:
    <<: *hardening
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-smokescreen:${FLOTILLA_TAG}
    container_name: flotilla-egress
    mem_limit: 128m
    cpus: 0.5
    command: ["--config-file", "/etc/smokescreen/smokescreen.yaml", "--expose-prometheus-metrics"]
    environment:
      FLOTILLA_CONFIG_HASH: ${FLOTILLA_CONFIG_HASH_EGRESS:-}   # deploy.sh: a changed ACL recreates it
    volumes:
      - ${FLOTILLA_CONFIG}/smokescreen.yaml:/etc/smokescreen/smokescreen.yaml:ro
      - ${FLOTILLA_CONFIG}/egress-acl.yaml:/etc/smokescreen/acl.yaml:ro
    networks: [flotilla, out, backend, litellm, glitchtip, langfuse]

  # The bugfix workers' own egress proxy (profile bugfix): its allowlist (FLOTILLA_CONFIG/egress-bugfix-acl.yaml:
  # GitHub, the npm registry, LiteLLM) is theirs alone, so opening GitHub's git and npm to a fleet that
  # runs repo code opens them to no other worker. The same image and settings as egress.
  egress-bugfix:
    <<: *hardening
    profiles: [bugfix]
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-smokescreen:${FLOTILLA_TAG}
    container_name: flotilla-egress-bugfix
    mem_limit: 128m
    cpus: 0.5
    command: ["--config-file", "/etc/smokescreen/smokescreen.yaml", "--expose-prometheus-metrics"]
    environment:
      FLOTILLA_CONFIG_HASH: ${FLOTILLA_CONFIG_HASH_EGRESS_BUGFIX:-}
    volumes:
      - ${FLOTILLA_CONFIG}/smokescreen.yaml:/etc/smokescreen/smokescreen.yaml:ro
      - ${FLOTILLA_CONFIG}/egress-bugfix-acl.yaml:/etc/smokescreen/acl.yaml:ro
    networks: [flotilla, out, litellm]

  # The seo fleet's own egress proxy (profile seo): its allowlist (FLOTILLA_CONFIG/egress-seo-acl.yaml: the
  # sites it checks, Google's token and Search Console endpoints, Umami) is its alone, and so is its
  # settings file (smokescreen-seo.yaml: allow_ranges only Umami's network).
  egress-seo:
    <<: *hardening
    profiles: [seo]
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-smokescreen:${FLOTILLA_TAG}
    container_name: flotilla-egress-seo
    mem_limit: 128m
    cpus: 0.5
    command: ["--config-file", "/etc/smokescreen/smokescreen.yaml", "--expose-prometheus-metrics"]
    environment:
      FLOTILLA_CONFIG_HASH: ${FLOTILLA_CONFIG_HASH_EGRESS_SEO:-}
    volumes:
      - ${FLOTILLA_CONFIG}/smokescreen-seo.yaml:/etc/smokescreen/smokescreen.yaml:ro
      - ${FLOTILLA_CONFIG}/egress-seo-acl.yaml:/etc/smokescreen/acl.yaml:ro
    networks: [flotilla, out, umami]

# Named so that a compose project rename can never strand them. TRIAGE_STATE_VOLUME picks the
# triage fleet's state: a shadow copy beside fleetd, or the live state after the switch.
volumes:
  state:
    name: ${FLOTILLA_STATE_VOLUME:-flotilla-state}
  # created and filled by deploy/server/secrets.sh before compose runs; compose never removes them
  flotillad-secrets:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-flotillad-secrets
    external: true
  worker-triage-secrets:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-worker-triage-secrets
    external: true
  worker-triage-candidate-secrets:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-worker-triage-candidate-secrets
    external: true
  triage-state:
    name: ${TRIAGE_STATE_VOLUME:-flotilla-triage-state-shadow}
    external: true
  # the live triage worker's frozen run states (written by it, read by the shadow worker); named so a compose rename cannot strand them
  triage-snapshots:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-triage-snapshots
  # the shadow worker's token and read environment (secrets.sh), and its own state
  worker-triage-shadow-secrets:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-worker-triage-shadow-secrets
    external: true
  triage-shadow-state:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-triage-shadow-state
  # the ops workers' tokens (profile ops); secrets.sh fills them when the tokens exist
  worker-ops-read-secrets:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-worker-ops-read-secrets
    external: true
  worker-ops-act-host-secrets:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-worker-ops-act-host-secrets
    external: true
  # the bugfix worker's token and model key (profile bugfix), filled by secrets.sh; its scratch space
  worker-bugfix-secrets:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-worker-bugfix-secrets
    external: true
  bugfix-scratch:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-bugfix-scratch
  worker-bugfix-act-secrets:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-worker-bugfix-act-secrets
    external: true
  # the marketing worker's token (profile seo), filled by secrets.sh
  worker-marketing-secrets:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-worker-marketing-secrets
    external: true
  # seeded by secrets.sh --seed-state from the live state before a comparison; never the live volume
  triage-candidate-state:
    name: ${TRIAGE_CANDIDATE_STATE_VOLUME:-flotilla-triage-state-candidate}
    external: true

networks:
  flotilla:
    internal: true
  # the shadow worker and its proxy: flotillad joins it to call the worker and to serve its ledger; nothing live does
  shadow:
    internal: true
  # ADR-0014: the UI's network. Only flotillad (its ui_listen) and the installation's caddy-tailscale proxy are
  # on it; internal, so it gives flotillad no route out. The proxy joins it as an external network.
  ui:
    name: ${NET_UI:-flotilla_ui}
    internal: true
  out: {}
  backend:
    name: ${NET_BACKEND:-backend_default}
    external: true
  litellm:
    name: ${NET_LITELLM:-litellm_default}
    external: true
  glitchtip:
    name: ${NET_GLITCHTIP:-glitchtip_default}
    external: true
  langfuse:
    name: ${NET_LANGFUSE:-langfuse_default}
    external: true
  # RFC-0014: the plumbing tool's network (n8n on the installation), owned by its compose project and internal,
  # so it gives flotillad no route out. Only flotillad joins: the hook it serves, the callbacks it is called back on.
  plumbing:
    name: ${NET_PLUMBING:-plumbing}
    external: true
  umami:   # the seo proxy reaches Umami there (RFC-0012)
    name: ${NET_UMAMI:-umami_default}
    external: true
