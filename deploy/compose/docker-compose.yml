# flotilla on one host (ADR-0002): flotillad, the triage worker and the egress proxy.
#
# Installation paths come from the environment (FLOTILLA_HOME/.env on the host, never in git) and the
# files in FLOTILLA_CONFIG (README.md). Nothing here writes to the host: the store, the triage
# fleet's state and the secrets live in Docker volumes inside the VM. Host folders are mounted
# read-only, for config only, like every other stack on the mini; writing through the VM's sshfs
# mount would ride the lima SSH connection whose failures took production down before.
#
# Secrets reach the containers through their own volumes, filled by deploy/mini/secrets.sh from the
# host's files (mode 600 there, owned by the container's uid in the volume). Nothing secret is in an
# environment variable or a bind mount.
#
# Networks:
#   flotilla       internal: no route out. flotillad, the worker and the proxy talk here.
#   out            the proxy's way to the internet (api.github.com).
#   the services'  the proxy joins the networks of the services jobs read (VictoriaMetrics, LiteLLM,
#                  GlitchTip, Langfuse) and reaches them by container name, never through the
#                  host's port forwards.
# Nothing is published on the host. The CLI runs inside flotillad: docker exec flotillad flotilla status
#
# The candidate worker (profile `candidate`, off unless COMPOSE_PROFILES=candidate): a second triage
# worker running the image tag under test (FLOTILLA_CANDIDATE_TAG) with its own state volume, for the
# job triage/cycle-shadow, which its spec caps at shadow (ADR-0004: shadow comparison).
name: flotilla

x-hardening: &hardening
  read_only: true
  init: true   # PID 1 reaps orphans: a job's grandchildren must not pile up as zombies
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  flotillad:
    <<: *hardening
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-flotillad:${FLOTILLA_TAG:?set FLOTILLA_TAG}
    container_name: flotillad
    mem_limit: 256m
    cpus: 0.5
    environment:
      HTTP_PROXY: http://egress:4750
      HTTPS_PROXY: http://egress:4750
      NO_PROXY: worker-triage,worker-triage-candidate,egress,localhost,127.0.0.1
      FLOTILLA_URL: http://127.0.0.1:8484
      FLOTILLA_TOKEN_FILE: /run/flotilla/cli.token
      FLOTILLA_CONFIG_HASH: ${FLOTILLA_CONFIG_HASH_FLOTILLAD:-}   # deploy.sh: a changed config recreates it
    volumes:
      - ${FLOTILLA_CONFIG:?set FLOTILLA_CONFIG}/flotillad.yaml:/etc/flotilla/flotillad.yaml:ro
      - ${FLOTILLA_CONFIG}/callers.yaml:/etc/flotilla/callers.yaml:ro
      - flotillad-secrets:/run/flotilla:ro
      - state:/var/lib/flotilla
    networks: [flotilla]
    depends_on:
      egress: {condition: service_started}
      worker-triage: {condition: service_healthy}   # the first run starts at boot: the worker must be listening
    healthcheck:
      test: ["CMD", "/usr/local/bin/flotilla", "health"]
      interval: 60s
      timeout: 10s
      retries: 3

  worker-triage:
    <<: *hardening
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-worker-triage:${FLOTILLA_TAG}
    container_name: flotilla-worker-triage
    mem_limit: 1g
    cpus: 1.0
    tmpfs: ["/tmp:size=64m"]
    env_file: ["${FLOTILLA_CONFIG}/worker-triage.env"]   # JOB_* overrides only; no secrets in it
    environment:
      FLOTILLA_WORKER_TOKEN_FILE: /run/flotilla/worker.token
      FLOTILLA_ENV_FILES: /run/flotilla/fleet.env
      FLOTILLA_WORKER_LISTEN: 0.0.0.0:8081
      JOB_HTTP_PROXY: http://egress:4750
      JOB_HTTPS_PROXY: http://egress:4750
    volumes:
      - worker-triage-secrets:/run/flotilla:ro
      - triage-state:/home/worker/signal-fleet
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/livez', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    networks: [flotilla]

  worker-triage-candidate:
    <<: *hardening
    profiles: [candidate]
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-worker-triage:${FLOTILLA_CANDIDATE_TAG:-${FLOTILLA_TAG}}
    container_name: flotilla-worker-triage-candidate
    mem_limit: 1g
    cpus: 1.0
    tmpfs: ["/tmp:size=64m"]
    env_file: ["${FLOTILLA_CONFIG}/worker-triage.env"]
    environment:
      FLOTILLA_WORKER_TOKEN_FILE: /run/flotilla/worker.token
      FLOTILLA_ENV_FILES: /run/flotilla/fleet.env
      FLOTILLA_WORKER_LISTEN: 0.0.0.0:8081
      JOB_HTTP_PROXY: http://egress:4750
      JOB_HTTPS_PROXY: http://egress:4750
    volumes:
      - worker-triage-secrets:/run/flotilla:ro           # the same fleet secrets; shadow never writes outward
      - triage-candidate-state:/home/worker/signal-fleet  # never the live state
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/livez', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    networks: [flotilla]

  egress:
    <<: *hardening
    image: ${FLOTILLA_REGISTRY:-ghcr.io/chipi}/flotilla-smokescreen:${FLOTILLA_TAG}
    container_name: flotilla-egress
    mem_limit: 128m
    cpus: 0.5
    command: ["--config-file", "/etc/smokescreen/smokescreen.yaml", "--expose-prometheus-metrics"]
    environment:
      FLOTILLA_CONFIG_HASH: ${FLOTILLA_CONFIG_HASH_EGRESS:-}   # deploy.sh: a changed ACL recreates it
    volumes:
      - ${FLOTILLA_CONFIG}/smokescreen.yaml:/etc/smokescreen/smokescreen.yaml:ro
      - ${FLOTILLA_CONFIG}/egress-acl.yaml:/etc/smokescreen/acl.yaml:ro
    networks: [flotilla, out, backend, litellm, glitchtip, langfuse]

# Named so that a compose project rename can never strand them. TRIAGE_STATE_VOLUME picks the
# triage fleet's state: a shadow copy beside fleetd, or the live state after the switch.
volumes:
  state:
    name: ${FLOTILLA_STATE_VOLUME:-flotilla-state}
  # created and filled by deploy/mini/secrets.sh before compose runs; compose never removes them
  flotillad-secrets:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-flotillad-secrets
    external: true
  worker-triage-secrets:
    name: ${FLOTILLA_VOLUME_PREFIX:-flotilla}-worker-triage-secrets
    external: true
  triage-state:
    name: ${TRIAGE_STATE_VOLUME:-flotilla-triage-state-shadow}
    external: true
  # seeded by secrets.sh --seed-state from the live state before a comparison; never the live volume
  triage-candidate-state:
    name: ${TRIAGE_CANDIDATE_STATE_VOLUME:-flotilla-triage-state-candidate}
    external: true

networks:
  flotilla:
    internal: true
  out: {}
  backend:
    name: ${NET_BACKEND:-backend_default}
    external: true
  litellm:
    name: ${NET_LITELLM:-litellm_default}
    external: true
  glitchtip:
    name: ${NET_GLITCHTIP:-glitchtip_default}
    external: true
  langfuse:
    name: ${NET_LANGFUSE:-langfuse_default}
    external: true
