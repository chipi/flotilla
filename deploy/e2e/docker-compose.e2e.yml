# The e2e's additions to deploy/compose/docker-compose.yml (deploy/e2e/run.sh passes both files): the
# specs flotillad reads (the shipped fleets plus the e2e-only fleet) and the e2e registry extension
# (host.true, the security e2e's harmless action, H9c). Never used by a deploy.
services:
  flotillad:
    volumes:
      - ${FLOTILLA_CONFIG}/specs:/etc/flotilla/specs:ro
      - ${FLOTILLA_CONFIG}/registry-e2e.json:/etc/flotilla/registry-e2e.json:ro
  # the stack's own CA (run.sh makes it): the example fleets that reach the outside world (sites, deps) reach
  # deploy/e2e/world.py instead, which answers with a certificate from this CA
  worker-ops-read:
    volumes:
      - ${FLOTILLA_CONFIG}/world/ca.pem:/etc/flotilla/world-ca.pem:ro
    environment:
      ROUTINE_SSL_CERT_FILE: /etc/flotilla/world-ca.pem
  worker-bugfix:
    volumes:
      - ${FLOTILLA_CONFIG}/world/ca.pem:/etc/flotilla/world-ca.pem:ro
    environment:
      ROUTINE_SSL_CERT_FILE: /etc/flotilla/world-ca.pem
  worker-triage:
    volumes:
      - ${FLOTILLA_CONFIG}/world/ca.pem:/etc/flotilla/world-ca.pem:ro
      # the e2e fleet's folder, where its station versions' texts are read from (the image carries the shipped fleets only)
      - ${FLOTILLA_CONFIG}/specs/e2e:/opt/flotilla/fleets/e2e:ro
    # a monitor on this worker writes its report to a file in HOME (the shadow worker has this tmpfs; the live one has none in the real compose): the
    # e2e's station monitor is the one routine here that does
    tmpfs: ["/tmp:size=64m", "/home/worker:size=64m,uid=10001,gid=10001,mode=0700"]
    environment:
      ROUTINE_SSL_CERT_FILE: /etc/flotilla/world-ca.pem
  worker-triage-shadow:
    volumes:
      - ${FLOTILLA_CONFIG}/world/ca.pem:/etc/flotilla/world-ca.pem:ro
      - ${FLOTILLA_CONFIG}/specs/e2e:/opt/flotilla/fleets/e2e:ro
    environment:
      ROUTINE_SSL_CERT_FILE: /etc/flotilla/world-ca.pem
