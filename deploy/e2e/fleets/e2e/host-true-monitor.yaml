fleet: e2e
routine: host-true-monitor
description: >-
  The security e2e's monitor (host agent plan H9c), never shipped: run by hand, it reports one
  e2e_host_true detection on host:e2e-host, the e2e's stand-in host, so a case goes through the whole
  path to a real execution there.
enabled: false
worker: ops-read
trigger:
  every: 60m
detects: [e2e_host_true]
run:
  command: >-
    printf '{"outcome": "detections", "detections": [{"kind": "e2e_host_true", "target": "host:e2e-host", "detail": "e2e"}]}'
    > "$FLOTILLA_PLAN_FILE"
  workdir: .
  timeout: 1m
autonomy: shadow
budget:
  day_usd: 0
freshness: 120m
