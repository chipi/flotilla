run:
  command: env VM_URL=http://victoriametrics:8080 FLOTILLA_REGISTRY=/etc/flotilla/registry-e2e.json python3 /opt/flotilla/ops/sop_investigate.py --fleet e2e
  workdir: .
  timeout: 3m
stations:
  investigate:
    harness: flotilla
    model: triage-flash
    prompts: {system: system.md, task: task.md}
    tools: all
    tool_names: [metric]
    gates: []
    limits: {max_turns: 4, timeout: 2m}
limits: {e2e: 1}
