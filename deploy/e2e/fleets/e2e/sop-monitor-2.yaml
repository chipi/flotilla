fleet: e2e
routine: sop-monitor-2
description: >-
  The SOP e2e's second monitor (operator step 1, C6b), never shipped: run by hand, it reports one more e2e_sop detection that no SOP covers
  (e2e-novel2). Its proposal is the one that stays open until the UI section's Accept answers it.
enabled: false
worker: ops-read
trigger:
  every: 60m
detects: [e2e_sop]
run:
  command: >-
    printf '{"outcome": "detections", "detections": [
    {"kind": "e2e_sop", "target": "host:e2e-sop-novel2", "detail": "e2e", "data": {"alert": "e2e-novel2"}}]}'
    > "$FLOTILLA_PLAN_FILE"
  workdir: .
  timeout: 1m
autonomy: record
budget:
  day_usd: 0
freshness: 120m
